<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>bolo7_x7</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    min-height:100%;
}

body{
    background:#000;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
    overflow-x:hidden;
}

/* =========================
   VIDEO DE FONDO
========================= */

#videoFondo{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    z-index:-10;
    background:#000;
}

.overlay{
    position:fixed;
    inset:0;
    z-index:-9;

    background:
        linear-gradient(
            rgba(0,0,0,.42),
            rgba(0,0,0,.84)
        );
}

.glow{
    position:fixed;
    width:650px;
    height:650px;
    left:50%;
    top:30%;
    transform:translate(-50%,-50%);

    background:
        radial-gradient(
            circle,
            rgba(0,234,255,.16),
            transparent 65%
        );

    pointer-events:none;
    z-index:-8;
}

/* =========================
   PARTICULAS
========================= */

#particles{
    position:fixed;
    inset:0;
    z-index:-7;
    pointer-events:none;
}

/* =========================
   CONTENEDOR
========================= */

.container{
    width:min(650px,92%);
    margin:auto;
    padding:45px 0 40px;
    text-align:center;
}

/* =========================
   PERFIL
========================= */

.profile{
    animation:aparecer 1s ease both;
}

@keyframes aparecer{
    from{
        opacity:0;
        transform:translateY(-30px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

.avatar-container{
    position:relative;
    width:135px;
    height:135px;
    margin:auto;
}

.avatar{
    width:135px;
    height:135px;
    object-fit:cover;
    border-radius:50%;

    border:3px solid #00eaff;

    box-shadow:
        0 0 15px #00eaff,
        0 0 50px rgba(0,234,255,.35);
}

.anillo{
    position:absolute;
    inset:-10px;

    border:2px solid rgba(0,234,255,.65);
    border-radius:50%;

    animation:girar 7s linear infinite;
}

.anillo::after{
    content:"";

    position:absolute;

    width:10px;
    height:10px;

    border-radius:50%;

    background:#00eaff;

    top:8px;
    left:20px;

    box-shadow:0 0 15px #00eaff;
}

@keyframes girar{
    from{
        transform:rotate(0deg);
    }

    to{
        transform:rotate(360deg);
    }
}

.nombre{
    margin-top:20px;

    font-size:38px;
    font-weight:900;

    letter-spacing:-1px;

    text-shadow:
        0 0 20px rgba(0,234,255,.35);
}

.verificado{
    display:inline-flex;

    align-items:center;
    justify-content:center;

    width:22px;
    height:22px;

    border-radius:50%;

    background:#00eaff;
    color:#001015;

    font-size:13px;

    vertical-align:5px;
}

.usuario{
    color:#aaa;
    margin-top:6px;
    font-size:14px;
}

.bio{
    margin:15px auto 22px;

    color:#ddd;

    line-height:1.6;

    font-size:14px;
}

/* =========================
   REDES
========================= */

.sociales{
    display:flex;
    justify-content:center;
    align-items:center;
    flex-wrap:wrap;

    gap:14px;

    margin-bottom:28px;
}

.social{
    width:55px;
    height:55px;

    border-radius:17px;

    display:flex;
    align-items:center;
    justify-content:center;

    text-decoration:none;
    color:white;

    position:relative;

    background:
        linear-gradient(
            145deg,
            #f8f8f8,
            #aeb3b8,
            #555a60,
            #e8e9ea
        );

    border:1px solid rgba(255,255,255,.9);

    box-shadow:
        inset 0 1px 2px rgba(255,255,255,.9),
        inset 0 -5px 8px rgba(0,0,0,.5),
        0 8px 25px rgba(0,0,0,.45);

    transition:.3s;

    cursor:pointer;

    overflow:hidden;
}

.social::before{
    content:"";

    position:absolute;

    top:-40%;
    left:-130%;

    width:55%;
    height:180%;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.9),
            transparent
        );

    transform:skewX(-25deg);

    transition:left .6s ease;
}

.social:hover::before{
    left:140%;
}

.social svg{
    width:26px;
    height:26px;

    fill:#111;

    position:relative;
    z-index:2;
}

.social:hover{
    transform:
        translateY(-8px)
        scale(1.1);

    box-shadow:
        inset 0 1px 3px #fff,
        0 12px 30px rgba(0,0,0,.7),
        0 0 22px rgba(255,255,255,.2);
}

.social:active{
    transform:
        translateY(1px)
        scale(.92);
}

.tooltip{
    position:absolute;

    bottom:-31px;

    padding:5px 8px;

    border-radius:6px;

    background:rgba(0,0,0,.85);

    font-size:10px;

    color:white;

    opacity:0;

    pointer-events:none;

    white-space:nowrap;

    transition:.2s;
}

.social:hover .tooltip{
    opacity:1;
}

/* =========================
   BOTONES GRANDES
========================= */

.links{
    display:flex;
    flex-direction:column;
    gap:15px;
}

.link{
    min-height:74px;
    width:100%;

    display:flex;
    align-items:center;

    text-decoration:none;

    color:#080808;

    padding:
        9px
        16px
        9px
        9px;

    border-radius:18px;

    position:relative;
    overflow:hidden;

    cursor:pointer;

    background:
        linear-gradient(
            145deg,
            #ffffff 0%,
            #dfe2e5 15%,
            #9da2a7 35%,
            #575c62 50%,
            #cfd3d6 70%,
            #f5f5f5 85%,
            #777c82 100%
        );

    border:1px solid #fff;

    box-shadow:
        inset 0 1px 3px rgba(255,255,255,.95),
        inset 0 -6px 10px rgba(0,0,0,.38),
        0 9px 25px rgba(0,0,0,.5);

    transition:
        transform .25s ease,
        box-shadow .25s ease,
        filter .25s ease;

    animation:
        subir .7s ease both;
}

.link:nth-child(1){
    animation-delay:.1s;
}

.link:nth-child(2){
    animation-delay:.2s;
}

.link:nth-child(3){
    animation-delay:.3s;
}

.link:nth-child(4){
    animation-delay:.4s;
}

.link:nth-child(5){
    animation-delay:.5s;
}

@keyframes subir{
    from{
        opacity:0;
        transform:translateY(25px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

/* BRILLO METALICO */

.link::before{
    content:"";

    position:absolute;

    top:-30%;
    left:-130%;

    width:55%;
    height:160%;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.9),
            transparent
        );

    transform:skewX(-25deg);

    transition:left .7s ease;

    pointer-events:none;
}

.link:hover::before{
    left:140%;
}

.link:hover{
    transform:
        translateY(-5px)
        scale(1.018);

    filter:brightness(1.08);

    box-shadow:
        inset 0 1px 4px #fff,
        inset 0 -6px 10px rgba(0,0,0,.3),
        0 14px 35px rgba(0,0,0,.7),
        0 0 22px rgba(255,255,255,.18);
}

.link:active{
    transform:
        translateY(2px)
        scale(.985);

    box-shadow:
        inset 0 5px 12px rgba(0,0,0,.5),
        0 3px 8px rgba(0,0,0,.5);
}

/* ICONOS */

.icon{
    width:54px;
    height:54px;

    flex-shrink:0;

    display:flex;
    align-items:center;
    justify-content:center;

    margin-right:14px;

    border-radius:15px;

    background:
        linear-gradient(
            145deg,
            #ffffff,
            #c7cbd0,
            #696e74,
            #e7e9eb
        );

    border:1px solid rgba(255,255,255,.95);

    box-shadow:
        inset 0 1px 2px rgba(255,255,255,.9),
        inset 0 -4px 7px rgba(0,0,0,.4),
        0 3px 8px rgba(0,0,0,.35);
}

.icon svg{
    width:28px;
    height:28px;
    fill:#111;
}

.link-text{
    flex:1;
    text-align:left;
}

.link-text strong{
    display:block;

    color:#050505;

    font-size:16px;
    font-weight:900;
}

.link-text small{
    display:block;

    color:#30343a;

    font-size:11px;
    font-weight:600;

    margin-top:4px;
}

.arrow{
    font-size:29px;

    color:#171717;

    font-weight:bold;

    transition:.25s;
}

.link:hover .arrow{
    transform:translateX(6px);
    color:#000;
}

/* =========================
   REPRODUCTOR
========================= */

.music{
    margin-top:26px;

    padding:17px;

    border-radius:20px;

    border:1px solid rgba(255,255,255,.15);

    background:
        rgba(5,7,12,.75);

    backdrop-filter:blur(18px);

    box-shadow:
        0 12px 40px rgba(0,0,0,.5);
}

.music-top{
    display:flex;

    align-items:center;

    gap:13px;
}

.cover{
    width:58px;
    height:58px;

    flex-shrink:0;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:14px;

    background:
        linear-gradient(
            135deg,
            #00eaff,
            #693cff,
            #ff2d75
        );

    box-shadow:
        0 0 25px rgba(0,234,255,.25);
}

.cover svg{
    width:28px;
    fill:white;
}

.music-info{
    flex:1;
    text-align:left;
}

.music-info strong{
    display:block;
    font-size:14px;
}

.music-info small{
    display:block;

    color:#8d94a3;

    margin-top:4px;
}

.equalizer{
    display:flex;

    align-items:end;

    gap:3px;

    height:25px;
}

.equalizer i{
    display:block;

    width:3px;

    background:#00eaff;

    border-radius:4px;

    animation:
        equalizar .8s infinite alternate;
}

.equalizer i:nth-child(1){
    height:9px;
}

.equalizer i:nth-child(2){
    height:18px;
    animation-delay:.15s;
}

.equalizer i:nth-child(3){
    height:12px;
    animation-delay:.3s;
}

.equalizer i:nth-child(4){
    height:21px;
    animation-delay:.45s;
}

@keyframes equalizar{
    to{
        height:23px;
    }
}

.play{
    width:45px;
    height:45px;

    border:0;

    border-radius:50%;

    background:#fff;
    color:#050505;

    cursor:pointer;

    font-size:17px;
    font-weight:bold;

    transition:.2s;
}

.play:hover{
    transform:scale(1.1);
}

.play:active{
    transform:scale(.92);
}

#seek{
    width:100%;

    margin-top:14px;

    accent-color:#00eaff;

    cursor:pointer;
}

.times{
    display:flex;
    justify-content:space-between;

    color:#777;

    font-size:10px;
}

.footer{
    margin-top:25px;

    color:#666;

    font-size:10px;
}


/* =========================
   PANTALLA DE ENTRADA
========================= */

body.locked{
    overflow:hidden;
}

#entrada{
    position:fixed;
    inset:0;
    z-index:9999;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    text-align:center;
    padding:24px;
    background:rgba(0,0,0,.68);
    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
    cursor:pointer;
    transition:opacity .8s ease, visibility .8s ease;
}

#entrada.oculta{
    opacity:0;
    visibility:hidden;
    pointer-events:none;
}

.entrada-box{
    width:min(430px,92vw);
    padding:34px 28px;
    border:1px solid rgba(255,255,255,.28);
    border-radius:28px;
    background:linear-gradient(145deg,rgba(255,255,255,.12),rgba(0,0,0,.52));
    box-shadow:
        inset 0 1px 1px rgba(255,255,255,.25),
        0 25px 80px rgba(0,0,0,.7),
        0 0 45px rgba(0,234,255,.10);
}

.entrada-logo{
    width:92px;
    height:92px;
    object-fit:cover;
    border-radius:50%;
    border:2px solid #00eaff;
    box-shadow:0 0 25px rgba(0,234,255,.55);
    margin-bottom:20px;
}

.entrada-titulo{
    font-size:30px;
    font-weight:900;
    letter-spacing:1px;
    margin-bottom:8px;
}

.entrada-subtitulo{
    color:#bfc4cc;
    font-size:13px;
    margin-bottom:24px;
}

.btn-entrar{
    position:relative;
    overflow:hidden;
    width:100%;
    min-height:60px;
    border:1px solid #fff;
    border-radius:17px;
    cursor:pointer;
    font-size:16px;
    font-weight:900;
    color:#080808;
    background:linear-gradient(145deg,#fff,#dfe2e5,#70757b,#f7f7f7,#8a8f94);
    box-shadow:
        inset 0 1px 3px rgba(255,255,255,.95),
        inset 0 -6px 10px rgba(0,0,0,.4),
        0 10px 30px rgba(0,0,0,.55);
    transition:.25s ease;
}

.btn-entrar::before{
    content:"";
    position:absolute;
    top:-40%;
    left:-130%;
    width:55%;
    height:180%;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.95),transparent);
    transform:skewX(-25deg);
    transition:left .7s ease;
}

.btn-entrar:hover::before{
    left:140%;
}

.btn-entrar:hover{
    transform:translateY(-4px) scale(1.015);
    filter:brightness(1.08);
    box-shadow:
        inset 0 1px 4px #fff,
        0 15px 35px rgba(0,0,0,.7),
        0 0 24px rgba(255,255,255,.16);
}

.btn-entrar:active{
    transform:translateY(2px) scale(.98);
}

.entrada-hint{
    margin-top:14px;
    color:#777;
    font-size:10px;
}

/* Copos negros: quedan visibles sobre el video y la pantalla de entrada */
#snow{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    z-index:10000;
    pointer-events:none;
}

#entrada{ z-index:10001; }

@media(max-width:500px){
    .entrada-box{
        padding:28px 20px;
        border-radius:23px;
    }

    .entrada-titulo{
        font-size:25px;
    }

    .entrada-logo{
        width:78px;
        height:78px;
    }
}

/* =========================
   TABLET
========================= */

@media
(min-width:501px)
and
(max-width:1000px){

    .container{
        width:min(680px,88%);
        padding-top:45px;
    }

    .link{
        min-height:75px;
    }

    .nombre{
        font-size:36px;
    }
}

/* =========================
   CELULAR
========================= */

@media(max-width:500px){

    .container{
        width:92%;

        padding:
            30px
            0
            30px;
    }

    .avatar-container{
        width:105px;
        height:105px;
    }

    .avatar{
        width:105px;
        height:105px;
    }

    .nombre{
        font-size:29px;
    }

    .sociales{
        gap:9px;
    }

    .social{
        width:48px;
        height:48px;

        border-radius:14px;
    }

    .social svg{
        width:22px;
        height:22px;
    }

    .link{
        min-height:68px;

        padding:8px;

        border-radius:16px;
    }

    .icon{
        width:49px;
        height:49px;

        margin-right:11px;
    }

    .icon svg{
        width:25px;
        height:25px;
    }

    .link-text strong{
        font-size:14px;
    }

    .link-text small{
        font-size:10px;
    }

    .arrow{
        font-size:24px;
    }
}

/* CELULARES PEQUEÑOS */

@media(max-width:360px){

    .container{
        width:94%;
    }

    .social{
        width:44px;
        height:44px;
    }

    .social svg{
        width:20px;
        height:20px;
    }

    .link-text small{
        display:none;
    }
}

/* TOUCH */

@media(hover:none){

    .link:hover{
        transform:none;
    }

    .link:active{
        transform:scale(.97);
    }

    .social:hover{
        transform:none;
    }

    .social:active{
        transform:scale(.9);
    }
}

.container{width:min(440px,90vw);min-height:100svh;padding:clamp(135px,25vh,250px) 0 24px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start}
.profile{width:100%;flex:none}
.avatar-container,.avatar{width:148px;height:148px}

.social svg{width:34px;height:34px;fill:#fff5f7;filter:drop-shadow(0 2px 5px rgba(0,0,0,.45))}

.social:hover,.social:focus-visible{transform:translateY(-5px) scale(1.06);box-shadow:0 0 25px rgba(245,142,172,.5),inset 0 1px rgba(255,255,255,.25);outline:none}
.social:active{transform:scale(.94)}
.social .tooltip{display:none}
.music{margin-top:auto;width:100%;padding:15px 16px;border-radius:20px;background:rgba(12,7,11,.65);border:1px solid rgba(255,215,227,.2);box-shadow:0 12px 38px rgba(0,0,0,.42);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px)}
.cover{background:linear-gradient(140deg,#8d3d57,#3a1828);box-shadow:none}
.play{background:#fff5f7}
#seek{accent-color:#e9a3b8}

<script>

/* =========================================================
   VIDEO DE FONDO
========================================================= */

const videoFondo = document.getElementById("videoFondo");
videoFondo.muted = true;
videoFondo.defaultMuted = true;
videoFondo.setAttribute("muted", "");
function iniciarVideo(){
    const intento = videoFondo.play();
    if(intento && typeof intento.catch === "function") intento.catch(err => console.warn("Video no reproducible; comprueba que fondo.mp4 esté codificado en H.264:",err));
}
videoFondo.addEventListener("loadeddata",iniciarVideo);
videoFondo.addEventListener("error",()=>console.error("No se pudo cargar fondo.mp4. Comprueba la ruta y el códec H.264."));
iniciarVideo();
document.addEventListener("click",iniciarVideo,{once:true});

const LINK_DE_LA_CANCION_AQUI =
"https://files.catbox.moe/fhoc54.mp3";

const audio =
document.getElementById("audio");

audio.src =
LINK_DE_LA_CANCION_AQUI;
audio.preload = "auto";
audio.volume = 1;

/* Intenta sonar al abrir; si el navegador lo bloquea,
   arranca con la primera interacción sin pantalla de entrada. */
let musicaIniciada = false;
async function intentarMusicaAutomatica(){
    if (musicaIniciada || !audio.paused) return;
    try {
        await audio.play();
        musicaIniciada = true;
        document.getElementById("play").textContent = "Ⅱ";
        quitarActivadoresMusica();
    } catch (error) {
        // Los navegadores móviles pueden bloquear audio con sonido sin interacción.
    }
}
function quitarActivadoresMusica(){
    document.removeEventListener("pointerdown", intentarMusicaAutomatica);
    document.removeEventListener("touchstart", intentarMusicaAutomatica);
    document.removeEventListener("keydown", intentarMusicaAutomatica);
}
document.addEventListener("pointerdown", intentarMusicaAutomatica);
document.addEventListener("touchstart", intentarMusicaAutomatica, {passive:true});
document.addEventListener("keydown", intentarMusicaAutomatica);
window.addEventListener("load", intentarMusicaAutomatica);
document.addEventListener("visibilitychange", () => {
    if (!document.hidden && !musicaIniciada) intentarMusicaAutomatica();
});
intentarMusicaAutomatica();


/* =========================================================
   PLAY / PAUSE
========================================================= */

const play =
document.getElementById("play");

play.onclick =
async function(){

    try{

        if(audio.paused){

            await audio.play();

            play.textContent =
                "Ⅱ";

        }else{

            audio.pause();

            play.textContent =
                "▶";

        }

    }catch(error){

        console.log(
            "No se pudo reproducir la canción:",
            error
        );

    }

};


/* =========================================================
   CUANDO TERMINA
========================================================= */

audio.addEventListener(
    "ended",
    function(){

        audio.currentTime = 0;

        audio.play();

        play.textContent = "Ⅱ";

    }
);


/* =========================================================
   BARRA DE PROGRESO
========================================================= */

const seek =
document.getElementById("seek");

audio.addEventListener(
    "timeupdate",
    function(){

        if(audio.duration){

            seek.value =
                (
                    audio.currentTime /
                    audio.duration
                ) * 100;

        }

        document.getElementById("actual")
            .textContent =
            formatoTiempo(
                audio.currentTime
            );

        document.getElementById("duracion")
            .textContent =
            formatoTiempo(
                audio.duration
            );

    }
);


seek.oninput =
function(){

    if(audio.duration){

        audio.currentTime =
            (
                seek.value /
                100
            ) *
            audio.duration;

    }

};


/* =========================================================
   TIEMPO
========================================================= */

function formatoTiempo(segundos){

    segundos =
        Math.floor(
            segundos || 0
        );

    return (

        Math.floor(
            segundos / 60
        )

        +

        ":" +

        String(
            segundos % 60
        ).padStart(
            2,
            "0"
        )

    );

}


/* =========================================================
   COPOS NEGROS
========================================================= */

const snowCanvas = document.getElementById("snow");
const snowCtx = snowCanvas.getContext("2d");
let snowflakes = [];

function resizeSnow(){
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    snowCanvas.width = window.innerWidth * dpr;
    snowCanvas.height = window.innerHeight * dpr;
    snowCanvas.style.width = window.innerWidth + "px";
    snowCanvas.style.height = window.innerHeight + "px";
    snowCtx.setTransform(dpr, 0, 0, dpr, 0, 0);

    snowflakes = Array.from({length:95}, () => ({
        x: Math.random() * window.innerWidth,
        y: Math.random() * window.innerHeight,
        size: Math.random() * 5 + 2,
        speed: Math.random() * 1.6 + .55,
        drift: Math.random() * 1.1 - .55,
        rotation: Math.random() * Math.PI * 2,
        rotationSpeed: Math.random() * .035 - .017
    }));
}

function dibujarCopo(ctx, x, y, size, rotation){
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rotation);

    ctx.fillStyle = "rgba(0,0,0,.82)";
    ctx.strokeStyle = "rgba(255,255,255,.18)";
    ctx.lineWidth = .7;

    ctx.beginPath();
    for(let i = 0; i < 6; i++){
        ctx.rotate(Math.PI / 3);
        ctx.moveTo(0, 0);
        ctx.lineTo(0, -size);
        ctx.moveTo(0, -size * .55);
        ctx.lineTo(size * .32, -size * .82);
        ctx.moveTo(0, -size * .55);
        ctx.lineTo(-size * .32, -size * .82);
    }
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(0, 0, Math.max(1, size * .12), 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
}

function animarNieve(){
    snowCtx.clearRect(0, 0, window.innerWidth, window.innerHeight);

    snowflakes.forEach(f => {
        f.y += f.speed;
        f.x += f.drift + Math.sin(f.y * .012) * .15;
        f.rotation += f.rotationSpeed;

        if(f.y > window.innerHeight + 12){
            f.y = -12;
            f.x = Math.random() * window.innerWidth;
        }

        if(f.x < -15) f.x = window.innerWidth + 15;
        if(f.x > window.innerWidth + 15) f.x = -15;

        dibujarCopo(snowCtx, f.x, f.y, f.size, f.rotation);
    });

    requestAnimationFrame(animarNieve);
}

resizeSnow();
window.addEventListener("resize", resizeSnow);
animarNieve();


/* =========================================================
   PARTICULAS
========================================================= */

const canvas =
document.getElementById("particles");

const ctx =
canvas.getContext("2d");

let particles = [];


function resizeCanvas(){

    canvas.width =
        window.innerWidth;

    canvas.height =
        window.innerHeight;

    particles =
        Array.from(
            {length:80},
            function(){

                return{

                    x:
                        Math.random() *
                        canvas.width,

                    y:
                        Math.random() *
                        canvas.height,

                    r:
                        Math.random() *
                        1.7 +
                        .3,

                    speed:
                        Math.random() *
                        .5 +
                        .1

                };

            }
        );

}


function animarParticulas(){

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    ctx.fillStyle =
        "rgba(0,234,255,.45)";

    particles.forEach(
        function(p){

            p.y -=
                p.speed;

            if(p.y < 0){

                p.y =
                    canvas.height;

            }

            p.x +=
                Math.sin(
                    p.y * .01
                ) * .08;

            ctx.beginPath();

            ctx.arc(
                p.x,
                p.y,
                p.r,
                0,
                Math.PI * 2
            );

            ctx.fill();

        }
    );

    requestAnimationFrame(
        animarParticulas
    );

}


resizeCanvas();

window.addEventListener(
    "resize",
    resizeCanvas
);

animarParticulas();

</script>
